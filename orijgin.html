<title>Gift List</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent}
body{overflow:hidden;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:#fff5dc}
.viewport{width:min(100%,420px);height:260px;overflow:hidden;background:transparent}
.track{animation:scroll 18s linear infinite;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}
.viewport:hover .track,.viewport.paused .track{animation-play-state:paused}
@keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
.card{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;margin:0 0 8px;padding:8px 11px;border:1px solid rgba(243,202,114,.48);border-radius:12px;background:rgba(24,20,14,.9)}
.card:first-child{margin-top:8px}
.icon{width:52px;height:52px;object-fit:contain;object-position:center}
.name{color:#fff1cf;font-size:20px;line-height:1.3;font-weight:700}
.map{margin-top:5px;color:#f3ca72;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
@media(max-width:360px){.card{grid-template-columns:46px minmax(0,1fr);gap:8px;padding:7px 9px}.icon{width:46px;height:46px}.name{font-size:17px}.map{font-size:16px}}
</style>
</head>
