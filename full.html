<title>Request List</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent}
body{overflow:hidden;color:#fff8e9;font-family:"Yu Gothic UI","Meiryo",sans-serif}
.viewport{width:min(100%,500px);height:700px;overflow:hidden;background:transparent}
.track{animation:scroll 36s linear infinite;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}
.viewport:hover .track,.viewport.paused .track{animation-play-state:paused}
@keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
.card{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;margin:0 0 9px;padding:10px 12px;border:1px solid rgba(243,202,114,.42);border-radius:13px;background:rgba(24,20,14,.9)}
.card:first-child{margin-top:8px}
.icon{width:58px;height:58px;border-radius:12px;overflow:hidden;background:rgba(45,45,45,.9)}
.icon svg{display:block;width:100%;height:100%}
.name{color:#fff1cf;font-size:16px;line-height:1.35;font-weight:700;overflow-wrap:anywhere}
.song{margin-top:5px;color:#f3ca72;font-size:22px;line-height:1.3;font-weight:750;overflow-wrap:anywhere}
@media(max-width:420px){.card{grid-template-columns:54px minmax(0,1fr);gap:9px;padding:8px 9px}.icon{width:50px;height:50px}.name{font-size:14px}.song{font-size:19px}}
</style>
